[project]
name = "snapmind"
version = "0.1.0"
description = "Modular pure-Python transformer inference framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "tiktoken>=0.5",
    "tokenizers>=0.15",
    "fastapi>=0.137.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
snapmind = "snapmind.serving.cli:main"

[project.optional-dependencies]
serve = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snapmind*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "numpy>=2.2.6",
    "pytest-asyncio>=1.4.0",
    "datasets>=2.14",
    "tqdm>=4.64",
]

[tool.pytest.ini_options]
testpaths = ["snapmind/tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (downloads large model weights)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
exclude = "snapmind/tests/"
